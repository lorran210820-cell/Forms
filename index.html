<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#083b66">
  <title>Coleta de Efetivo</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23083b66'/%3E%3Cpath d='M15 48V29h9v19m7 0V16h9v32m7 0V24h9v24' stroke='%23fff' stroke-width='5' fill='none'/%3E%3C/svg%3E">
  <style>
    :root{--navy:#083b66;--blue:#0b65a5;--sky:#e8f3fa;--ink:#17212b;--muted:#5f6d79;--line:#d7e0e7;--danger:#b42318;--ok:#067647;--bg:#f3f6f8;--white:#fff}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Arial,Helvetica,sans-serif}
    header{background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff;padding:24px 18px 42px}
    header div,main{max-width:760px;margin:auto} h1{margin:0 0 4px;font-size:1.65rem} header p{margin:0;opacity:.9}
    main{margin-top:-24px;padding:0 14px 40px}.card{background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px #17324d14;padding:20px}
    .grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}label{font-weight:700;font-size:.92rem}
    input,select,button{font:inherit}input,select{width:100%;min-height:46px;border:1px solid #aebbc6;border-radius:8px;background:#fff;padding:10px 12px;color:var(--ink)}input:focus,select:focus{outline:3px solid #b9dcf3;border-color:var(--blue)}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:25px 0 10px}.section-head h2{font-size:1.08rem;margin:0}.section-head span{color:var(--muted);font-size:.88rem}
    #workers{display:flex;flex-direction:column;gap:9px}.worker{display:grid;grid-template-columns:38px minmax(120px,1fr) minmax(155px,.85fr) 42px;gap:8px;align-items:center;background:#f8fafb;border:1px solid var(--line);border-radius:10px;padding:9px}.num{font-weight:800;color:var(--navy);text-align:center}.remove{border:0;background:transparent;color:var(--danger);font-size:1.45rem;min-height:42px;border-radius:7px;cursor:pointer}.remove:hover{background:#fee4e2}
    .actions{display:flex;gap:10px;margin-top:14px}.secondary,.primary{border:0;border-radius:9px;min-height:48px;padding:10px 16px;font-weight:700;cursor:pointer}.secondary{background:var(--sky);color:var(--navy)}.primary{margin-left:auto;background:var(--navy);color:#fff;min-width:170px}.primary:disabled{opacity:.6;cursor:wait}
    .summary{display:flex;justify-content:space-between;gap:12px;background:#eef5f9;border-radius:9px;padding:11px 13px;margin-top:18px;color:var(--navy);font-weight:700}.message{display:none;margin-top:15px;padding:12px;border-radius:8px}.message.ok{display:block;background:#dff6ea;color:var(--ok)}.message.error{display:block;background:#fee4e2;color:var(--danger)}.privacy{color:var(--muted);font-size:.82rem;margin:15px 0 0}
    @media(max-width:620px){header{padding-top:20px}.grid{grid-template-columns:1fr}.card{padding:16px}.worker{grid-template-columns:32px 1fr 42px}.worker select{grid-column:2/3}.worker .remove{grid-column:3;grid-row:1/3}.actions{flex-wrap:wrap}.secondary,.primary{width:100%;margin:0}.summary{font-size:.92rem}}
  </style>
</head>
<body>
  <header><div><h1>Coleta de Efetivo</h1><p>Informe o efetivo completo sob sua responsabilidade.</p></div></header>
  <main><form id="form" class="card">
    <div class="grid">
      <div class="field"><label for="foreman">Encarregado</label><input id="foreman" name="foreman" required autocomplete="name" placeholder="Nome completo"></div>
      <div class="field"><label for="date">Data de referência</label><input id="date" name="date" type="date" required></div>
    </div>
    <div class="section-head"><h2>Colaboradores</h2><span>Informe somente a matrícula</span></div>
    <div id="workers"></div>
    <div class="actions"><button class="secondary" id="add" type="button">+ Adicionar matrícula</button><button class="primary" id="submit" type="submit">Enviar efetivo</button></div>
    <div class="summary"><span>Total informado</span><span id="total">0 colaboradores</span></div>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <p class="privacy">Inclua presentes, faltas, folgas, atestados e afastamentos. Confira as matrículas antes do envio.</p>
  </form></main>
  <script>
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwHRR4KTrLQNr2WOV8Bi7ngWGD76E3AKxsWSghVWlhe0OnFbpaY5oMvh6NoGdMdEKEt/exec';
    const statuses = ['PRESENTE','FALTA','FOLGA','ATESTADO','AFASTADO'];
    const workers = document.querySelector('#workers');
    const total = document.querySelector('#total');
    const form = document.querySelector('#form');
    const message = document.querySelector('#message');
    const submit = document.querySelector('#submit');
    document.querySelector('#date').value = new Date().toLocaleDateString('en-CA');

    function update(){
      const n=workers.children.length;
      [...workers.children].forEach((row,i)=>row.querySelector('.num').textContent=i+1);
      total.textContent=`${n} colaborador${n===1?'':'es'}`;
    }
    function addWorker(){
      const row=document.createElement('div'); row.className='worker';
      row.innerHTML=`<span class="num"></span><input class="registration" inputmode="numeric" required aria-label="Matrícula" placeholder="Matrícula"><select class="status" required aria-label="Situação">${statuses.map(s=>`<option value="${s}">${s[0]+s.slice(1).toLowerCase()}</option>`).join('')}</select><button class="remove" type="button" aria-label="Remover matrícula">×</button>`;
      row.querySelector('.remove').onclick=()=>{if(workers.children.length>1){row.remove();update()}};
      workers.append(row); update();
    }
    document.querySelector('#add').onclick=addWorker;
    for(let i=0;i<8;i++) addWorker();

    form.addEventListener('submit',async(event)=>{
      event.preventDefault(); message.className='message';
      const entries=[...workers.querySelectorAll('.worker')].map(row=>({registration:row.querySelector('.registration').value.trim(),status:row.querySelector('.status').value})).filter(x=>x.registration);
      if(!entries.length){message.textContent='Informe pelo menos uma matrícula.';message.className='message error';return}
      if(new Set(entries.map(x=>x.registration)).size!==entries.length){message.textContent='Existe matrícula repetida. Corrija antes de enviar.';message.className='message error';return}
      if(ENDPOINT.startsWith('COLE_')){message.textContent='O formulário ainda não foi conectado à planilha.';message.className='message error';return}
      submit.disabled=true;submit.textContent='Enviando…';
      try{
        await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({foreman:document.querySelector('#foreman').value.trim(),referenceDate:document.querySelector('#date').value,entries})});
        form.reset();workers.innerHTML='';for(let i=0;i<8;i++)addWorker();document.querySelector('#date').value=new Date().toLocaleDateString('en-CA');
        message.textContent='Efetivo enviado com sucesso.';message.className='message ok';
      }catch(error){message.textContent='Não foi possível enviar. Verifique sua conexão e tente novamente.';message.className='message error'}
      finally{submit.disabled=false;submit.textContent='Enviar efetivo'}
    });
  </script>
</body>
</html>
